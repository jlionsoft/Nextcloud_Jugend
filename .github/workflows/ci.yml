name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: composer lint
      - name: JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/settings.js
          node --check js/organization.js
