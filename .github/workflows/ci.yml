name: CI

on:
  push:
    branches:
      - main
      - feature/native-app-foundation
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/settings.js
      - name: Validate appinfo/info.xml against the App Store schema
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          curl -fsSL https://apps.nextcloud.com/schema/apps/info.xsd -o "$RUNNER_TEMP/info.xsd"
          xmllint --noout --schema "$RUNNER_TEMP/info.xsd" appinfo/info.xml
